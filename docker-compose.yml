services:
  website:
    build: .
    container_name: personal-website
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - web

  ai-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: personal-website-ai
    environment:
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.longcat.chat/anthropic}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-LongCat-2.0-Preview}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
      GATEWAY_DATA_DIR: /data
      UPLOAD_ROOT: /data/uploads
    expose:
      - "8787"
    volumes:
      - ai_gateway_data:/data
    restart: unless-stopped
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "18080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - web
    depends_on:
      - website
      - ai-api

networks:
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  ai_gateway_data:
