services:
  website:
    build: .
    container_name: personal-website
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - web

  ai-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: personal-website-ai
    environment:
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.longcat.chat/anthropic}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-LongCat-2.0-Preview}
    expose:
      - "8787"
    restart: unless-stopped
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "18080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - web
    depends_on:
      - website
      - ai-api

networks:
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
